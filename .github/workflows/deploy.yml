name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [cblog-content-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set BASE_PATH
        id: base_path
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "BASE_PATH=" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_BASE_PATH=" >> $GITHUB_ENV
            DEFAULT_SITE_URL="https://${{ github.repository_owner }}.github.io"
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}" >> $GITHUB_ENV
            DEFAULT_SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          echo "SITE_URL=${{ vars.SITE_URL || '' }}" >> $GITHUB_ENV
          if [ -z "${{ vars.SITE_URL || '' }}" ]; then
            echo "SITE_URL=$DEFAULT_SITE_URL" >> $GITHUB_ENV
          fi

      - name: Validate production build configuration
        env:
          WEB_CONTENT_SOURCE: ${{ vars.WEB_CONTENT_SOURCE || 'filesystem' }}
          CONTENT_API_BASE_URL: ${{ vars.CONTENT_API_BASE_URL }}
          DEPLOY_CALLBACK_URL: ${{ vars.DEPLOY_CALLBACK_URL }}
          DEPLOY_CALLBACK_SECRET: ${{ secrets.DEPLOY_CALLBACK_SECRET }}
        run: |
          if [ "$WEB_CONTENT_SOURCE" = "api" ] && [ -z "$CONTENT_API_BASE_URL" ]; then
            echo "::error::WEB_CONTENT_SOURCE=api 时必须配置 vars.CONTENT_API_BASE_URL"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && \
             { [ -z "$DEPLOY_CALLBACK_URL" ] || [ -z "$DEPLOY_CALLBACK_SECRET" ]; }; then
            echo "::error::repository_dispatch 必须配置 DEPLOY_CALLBACK_URL/DEPLOY_CALLBACK_SECRET"
            exit 1
          fi

      - name: Build
        run: pnpm --filter @cblog/web build
        env:
          NODE_ENV: production
          WEB_RENDER_MODE: static-export
          WEB_CONTENT_SOURCE: ${{ vars.WEB_CONTENT_SOURCE || 'filesystem' }}
          CONTENT_API_BASE_URL: ${{ vars.CONTENT_API_BASE_URL }}
          CONTENT_API_READ_TOKEN: ${{ secrets.CONTENT_API_READ_TOKEN }}
          PUBLICATION_DRIVER: github-dispatch

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./apps/web/out"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 部署结果签名回报（STATIC-006）：独立 job + if: always()，callback 失败不逆转部署结果，仅告警
  callback:
    name: Report deployment result
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && github.event_name == 'repository_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send deploy callback
        env:
          DEPLOY_CALLBACK_URL: ${{ vars.DEPLOY_CALLBACK_URL }}
          DEPLOY_CALLBACK_SECRET: ${{ secrets.DEPLOY_CALLBACK_SECRET }}
        run: |
          if [ -z "$DEPLOY_CALLBACK_URL" ] || [ -z "$DEPLOY_CALLBACK_SECRET" ]; then
            echo "::error::部署回报配置缺失"
            exit 1
          fi
          STATUS="failed"
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            STATUS="succeeded"
          fi
          node scripts/send-deploy-callback.mjs \
            --batch-id "${{ github.event.client_payload.batchId || github.run_id }}" \
            --status "$STATUS" \
            --detail "run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (conclusion: ${{ needs.deploy.result }})"
