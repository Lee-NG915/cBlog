services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cblog
      POSTGRES_PASSWORD: cblog
      POSTGRES_DB: cblog
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cblog -d cblog"]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: "no"
